
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIDS MUSIC WORLD - Animation Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101b2b;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #123f35;
    }

    header h1 {
      margin: 0;
      color: #ffe66d;
    }

    header p {
      margin-bottom: 0;
    }

    .studio {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .stage {
      position: relative;
      height: 480px;
      overflow: hidden;
      border: 5px solid #ffffff;
      border-radius: 18px;
      background: linear-gradient(
        #65d7ff 0%,
        #b8f4ff 55%,
        #72d65d 56%,
        #268a43 100%
      );
    }

    .sun {
      position: absolute;
      top: 35px;
      right: 70px;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: #ffdf38;
      box-shadow: 0 0 40px #fff3a0;
    }

    .rainbow {
      position: absolute;
      top: 75px;
      left: 50%;
      width: 290px;
      height: 145px;
      transform: translateX(-50%);
      border: 18px solid #ff5d73;
      border-bottom: 0;
      border-radius: 170px 170px 0 0;
      box-shadow:
        inset 0 18px #ffb347,
        inset 0 36px #fff36d;
      opacity: 0.85;
    }

    .tree {
      position: absolute;
      bottom: 95px;
      font-size: 95px;
    }

    .tree.left {
      left: 12px;
    }

    .tree.right {
      right: 12px;
    }

    .stage-title {
      position: absolute;
      top: 18px;
      left: 50%;
      width: 90%;
      transform: translateX(-50%);
      text-align: center;
      color: #ffffff;
      font-size: clamp(18px, 4vw, 32px);
      font-weight: bold;
      text-shadow: 2px 3px 5px #333;
      z-index: 2;
    }

    .dance-floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 105px;
      background: repeating-linear-gradient(
        90deg,
        #f7a928 0 70px,
        #e85d75 70px 140px,
        #7b67d9 140px 210px
      );
      border-top: 7px solid #fff;
    }

    .balloon {
      position: absolute;
      font-size: 42px;
      animation: floatBalloon 3s ease-in-out infinite;
    }

    .balloon.one {
      top: 130px;
      left: 22%;
    }

    .balloon.two {
      top: 165px;
      right: 22%;
      animation-delay: 1s;
    }

    .balloon.three {
      top: 235px;
      left: 45%;
      animation-delay: 0.5s;
    }

    @keyframes floatBalloon {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-18px);
      }
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 22px 0;
    }

    button {
      padding: 13px 22px;
      border: 0;
      border-radius: 9px;
      background: #18b77b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0e8f60;
    }

    .status {
      text-align: center;
      color: #b8f4ff;
    }

    @media(max-width: 600px) {
      .stage {
        height: 390px;
      }

      .tree {
        font-size: 65px;
      }
    }
 
/* ANIMAL CHARACTER STAGE */

.animal-stage {
  position: absolute;
  z-index: 5;
  bottom: 80px;
  left: 2%;
  width: 96%;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  gap: 4px;
}

.animal {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}

.animal-emoji {
  display: inline-block;
  font-size: clamp(35px, 7vw, 75px);
  transform-origin: bottom center;
}

.animal-name {
  background: #ffffff;
  color: #244a35;
  border-radius: 20px;
  padding: 4px 9px;
  font-size: 12px;
  font-weight: bold;
}

.bear .animal-emoji {
  animation: bearDance 1.4s infinite ease-in-out;
}

.bunny .animal-emoji {
  animation: bunnyJump 1s infinite ease-in-out;
}

.lion .animal-emoji {
  animation: lionDance 1.2s infinite ease-in-out;
}

.elephant .animal-emoji {
  animation: elephantDance 1.5s infinite ease-in-out;
}

.monkey .animal-emoji {
  animation: monkeyDance 0.8s infinite ease-in-out;
}

.giraffe .animal-emoji {
  animation: giraffeDance 1.3s infinite ease-in-out;
}

@keyframes bearDance {
  0%, 100% { transform: rotate(-12deg) translateY(0); }
  50% { transform: rotate(12deg) translateY(-18px); }
}

@keyframes bunnyJump {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-35px) rotate(8deg); }
}

@keyframes lionDance {
  0%, 100% { transform: rotate(0); }
  50% { transform: rotate(18deg) scale(1.15); }
}

@keyframes elephantDance {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg) translateY(-12px); }
}

@keyframes monkeyDance {
  0%, 100% { transform: rotate(-18deg) translateX(-5px); }
  50% { transform: rotate(18deg) translateX(5px); }
}

@keyframes giraffeDance {
  0%, 100% { transform: translateY(0) rotate(-7deg); }
  50% { transform: translateY(-15px) rotate(7deg); }
}
 </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

  <header>
    <h1>🎬 KIDS MUSIC WORLD</h1>
    <p>Our Original 3D Animation Studio</p>
  </header>

  <main class="studio">

    <div class="stage" id="stage">

      <div class="stage-title">
        🎉 THE DANCING ANIMAL PARTY 🎉
      </div>

      <div class="sun"></div>
      <div class="rainbow"></div>

      <div class="tree left">🌳</div>
      <div class="tree right">🌴</div>

      <div class="balloon one">🎈</div>
      <div class="balloon two">🎈</div>
      <div class="balloon three">🎈</div>

     
<!-- REAL 3D ANIMAL STAGE -->
<div id="three-scene"></div>
      
<div class="animal-stage">

  <div class="animal bear">
    <span class="animal-emoji">🐻</span>
    <span class="animal-name">Benny</span>
  </div>

  <div class="animal bunny">
    <span class="animal-emoji">🐰</span>
    <span class="animal-name">Bella</span>
  </div>

  <div class="animal lion">
    <span class="animal-emoji">🦁</span>
    <span class="animal-name">Leo</span>
  </div>

  <div class="animal elephant">
    <span class="animal-emoji">🐘</span>
    <span class="animal-name">Ellie</span>
  </div>

  <div class="animal monkey">
    <span class="animal-emoji">🐵</span>
    <span class="animal-name">Max</span>
  </div>

  <div class="animal giraffe">
    <span class="animal-emoji">🦒</span>
    <span class="animal-name">Gigi</span>
  </div>

</div>
 <div class="dance-floor"></div>

    </div>

    <div class="controls">
      <button onclick="startParty()">▶ Start Animation</button>
      <button onclick="stopParty()">⏸ Pause Animation</button>
      <button onclick="resetParty()">↻ Reset Scene</button>
    </div>

    <p class="status" id="status">
      Animation Studio Ready!
    </p>

  </main>

  <script>
    const balloons = document.querySelectorAll(".balloon");
    const statusText = document.getElementById("status");

    function startParty() {
      balloons.forEach(balloon => {
        balloon.style.animationPlayState = "running";
      });

      statusText.textContent = "🎉 The animal party has started!";
    }

    function stopParty() {
      balloons.forEach(balloon => {
        balloon.style.animationPlayState = "paused";
      });

      statusText.textContent = "Animation paused.";
    }

    function resetParty() {
      balloons.forEach(balloon => {
        balloon.style.animation = "none";
        balloon.offsetHeight;
        balloon.style.animation = "";
      });

      startParty();
      statusText.textContent = "Scene reset successfully!";
    }
  </script>

</body>
</html>
