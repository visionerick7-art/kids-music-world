
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIDS MUSIC WORLD - Animation Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101b2b;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #123f35;
    }

    header h1 {
      margin: 0;
      color: #ffe66d;
    }

    header p {
      margin-bottom: 0;
    }

    .studio {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .stage {
      position: relative;
      height: 480px;
      overflow: hidden;
      border: 5px solid #ffffff;
      border-radius: 18px;
      background: linear-gradient(
        #65d7ff 0%,
        #b8f4ff 55%,
        #72d65d 56%,
        #268a43 100%
      );
    }

    .sun {
      position: absolute;
      top: 35px;
      right: 70px;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: #ffdf38;
      box-shadow: 0 0 40px #fff3a0;
    }

    .rainbow {
      position: absolute;
      top: 75px;
      left: 50%;
      width: 290px;
      height: 145px;
      transform: translateX(-50%);
      border: 18px solid #ff5d73;
      border-bottom: 0;
      border-radius: 170px 170px 0 0;
      box-shadow:
        inset 0 18px #ffb347,
        inset 0 36px #fff36d;
      opacity: 0.85;
    }

    .tree {
      position: absolute;
      bottom: 95px;
      font-size: 95px;
    }

    .tree.left {
      left: 12px;
    }

    .tree.right {
      right: 12px;
    }

    .stage-title {
      position: absolute;
      top: 18px;
      left: 50%;
      width: 90%;
      transform: translateX(-50%);
      text-align: center;
      color: #ffffff;
      font-size: clamp(18px, 4vw, 32px);
      font-weight: bold;
      text-shadow: 2px 3px 5px #333;
      z-index: 2;
    }

    .dance-floor {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 105px;
      background: repeating-linear-gradient(
        90deg,
        #f7a928 0 70px,
        #e85d75 70px 140px,
        #7b67d9 140px 210px
      );
      border-top: 7px solid #fff;
    }

    .balloon {
      position: absolute;
      font-size: 42px;
      animation: floatBalloon 3s ease-in-out infinite;
    }

    .balloon.one {
      top: 130px;
      left: 22%;
    }

    .balloon.two {
      top: 165px;
      right: 22%;
      animation-delay: 1s;
    }

    .balloon.three {
      top: 235px;
      left: 45%;
      animation-delay: 0.5s;
    }

    @keyframes floatBalloon {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-18px);
      }
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 22px 0;
    }

    button {
      padding: 13px 22px;
      border: 0;
      border-radius: 9px;
      background: #18b77b;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0e8f60;
    }

    .status {
      text-align: center;
      color: #b8f4ff;
    }

    @media(max-width: 600px) {
      .stage {
        height: 390px;
      }

      .tree {
        font-size: 65px;
      }
    }
 
/* ANIMAL CHARACTER STAGE */

.animal-stage {
  position: absolute;
  z-index: 5;
  bottom: 80px;
  left: 2%;
  width: 96%;
  display: flex;
  justify-content: space-around;
  align-items: flex-end;
  gap: 4px;
}

.animal {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 0;
}

.animal-emoji {
  display: inline-block;
  font-size: clamp(35px, 7vw, 75px);
  transform-origin: bottom center;
}

.animal-name {
  background: #ffffff;
  color: #244a35;
  border-radius: 20px;
  padding: 4px 9px;
  font-size: 12px;
  font-weight: bold;
}

.bear .animal-emoji {
  animation: bearDance 1.4s infinite ease-in-out;
}

.bunny .animal-emoji {
  animation: bunnyJump 1s infinite ease-in-out;
}

.lion .animal-emoji {
  animation: lionDance 1.2s infinite ease-in-out;
}

.elephant .animal-emoji {
  animation: elephantDance 1.5s infinite ease-in-out;
}

.monkey .animal-emoji {
  animation: monkeyDance 0.8s infinite ease-in-out;
}

.giraffe .animal-emoji {
  animation: giraffeDance 1.3s infinite ease-in-out;
}

@keyframes bearDance {
  0%, 100% { transform: rotate(-12deg) translateY(0); }
  50% { transform: rotate(12deg) translateY(-18px); }
}

@keyframes bunnyJump {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-35px) rotate(8deg); }
}

@keyframes lionDance {
  0%, 100% { transform: rotate(0); }
  50% { transform: rotate(18deg) scale(1.15); }
}

@keyframes elephantDance {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg) translateY(-12px); }
}

@keyframes monkeyDance {
  0%, 100% { transform: rotate(-18deg) translateX(-5px); }
  50% { transform: rotate(18deg) translateX(5px); }
}

@keyframes giraffeDance {
  0%, 100% { transform: translateY(0) rotate(-7deg); }
  50% { transform: translateY(-15px) rotate(7deg); }
}
#three-scene {
  width: 100%;
  height: 450px;
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  background: linear-gradient(
    to bottom,
    #87ceeb,
    #d8f5ff,
    #8bdc79
  );
}

#three-scene canvas {
  display: block;
  width: 100%;
  height: 100%;
}
  </style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

  <header>
    <h1>🎬 KIDS MUSIC WORLD</h1>
    <p>Our Original 3D Animation Studio</p>
  </header>

  <main class="studio">

    <div class="stage" id="stage">

      <div class="stage-title">
        🎉 THE DANCING ANIMAL PARTY 🎉
      </div>

      <div class="sun"></div>
      <div class="rainbow"></div>

      <div class="tree left">🌳</div>
      <div class="tree right">🌴</div>

      <div class="balloon one">🎈</div>
      <div class="balloon two">🎈</div>
      <div class="balloon three">🎈</div>

     
<!-- REAL 3D ANIMAL STAGE -->
<div id="three-scene"></div>
      
<div class="animal-stage">

  <div class="animal bear">
    <span class="animal-emoji">🐻</span>
    <span class="animal-name">Benny</span>
  </div>

  <div class="animal bunny">
    <span class="animal-emoji">🐰</span>
    <span class="animal-name">Bella</span>
  </div>

  <div class="animal lion">
    <span class="animal-emoji">🦁</span>
    <span class="animal-name">Leo</span>
  </div>

  <div class="animal elephant">
    <span class="animal-emoji">🐘</span>
    <span class="animal-name">Ellie</span>
  </div>

  <div class="animal monkey">
    <span class="animal-emoji">🐵</span>
    <span class="animal-name">Max</span>
  </div>

  <div class="animal giraffe">
    <span class="animal-emoji">🦒</span>
    <span class="animal-name">Gigi</span>
  </div>

</div>
 <div class="dance-floor"></div>

    </div>

    <div class="controls">
      <button onclick="startParty()">▶ Start Animation</button>
      <button onclick="stopParty()">⏸ Pause Animation</button>
      <button onclick="resetParty()">↻ Reset Scene</button>
    </div>

    <p class="status" id="status">
      Animation Studio Ready!
    </p>

  </main>

  <script>
    const balloons = document.querySelectorAll(".balloon");
    const statusText = document.getElementById("status");

    function startParty() {
      balloons.forEach(balloon => {
        balloon.style.animationPlayState = "running";
      });

      statusText.textContent = "🎉 The animal party has started!";
    }

    function stopParty() {
      balloons.forEach(balloon => {
        balloon.style.animationPlayState = "paused";
      });

      statusText.textContent = "Animation paused.";
    }

    function resetParty() {
      balloons.forEach(balloon => {
        balloon.style.animation = "none";
        balloon.offsetHeight;
        balloon.style.animation = "";
      });

      startParty();
      statusText.textContent = "Scene reset successfully!";
    }
  </script>


<script>
const sceneContainer = document.getElementById("three-scene");

if (typeof THREE === "undefined") {
  sceneContainer.innerHTML =
    "<p style='padding:20px;color:#922'>3D engine not loaded. Check your internet connection.</p>";
} else {
  // Create the 3D world
  const scene = new THREE.Scene();
  scene.background = new THREE.Color("#87ceeb");

  const camera = new THREE.PerspectiveCamera(
    45,
    sceneContainer.clientWidth / sceneContainer.clientHeight,
    0.1,
    100
  );
  camera.position.set(0, 2.2, 8);
  camera.lookAt(0, 1.2, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(
    sceneContainer.clientWidth,
    sceneContainer.clientHeight
  );
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  sceneContainer.appendChild(renderer.domElement);

  // Lighting
  scene.add(new THREE.HemisphereLight(0xffffff, 0x668855, 2));

  const sunlight = new THREE.DirectionalLight(0xffffff, 2);
  sunlight.position.set(4, 7, 5);
  sunlight.castShadow = true;
  scene.add(sunlight);

  // Green floor
  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(5, 64),
    new THREE.MeshStandardMaterial({ color: "#75c95b" })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.05;
  floor.receiveShadow = true;
  scene.add(floor);

  // Benny's materials
  const brown = new THREE.MeshStandardMaterial({ color: "#9b572d", roughness: 0.85 });
  const lightBrown = new THREE.MeshStandardMaterial({ color: "#d69a65", roughness: 0.8 });
 // Benny's new facial materials
const pink = new THREE.MeshStandardMaterial({
  color: "#f28b91",
  roughness: 0.7
});

const eyeShine = new THREE.MeshBasicMaterial({
  color: "#ffffff"
}); const black = new THREE.MeshStandardMaterial({ color: "#211713" });
  const white = new THREE.MeshStandardMaterial({ color: "#ffffff" });

  const bear = new THREE.Group();
  scene.add(bear);

  function sphere(parent, material, position, scale) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(1, 32, 24),
      material
    );
    mesh.position.set(...position);
    mesh.scale.set(...scale);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    parent.add(mesh);
    return mesh;
  }

  // Body and tummy
  sphere(bear, brown, [0, 1.05, 0], [0.78, 0.95, 0.48]);
  sphere(bear, lightBrown, [0, 1.05, 0.43], [0.49, 0.62, 0.12]);

  // Head
  sphere(bear, brown, [0, 2.25, 0], [0.82, 0.78, 0.68]);

  // Ears
  sphere(bear, brown, [-0.65, 2.88, 0], [0.27, 0.3, 0.22]);
  sphere(bear, brown, [0.65, 2.88, 0], [0.27, 0.3, 0.22]);
  sphere(bear, lightBrown, [-0.65, 2.9, 0.19], [0.14, 0.17, 0.06]);
  sphere(bear, lightBrown, [0.65, 2.9, 0.19], [0.14, 0.17, 0.06]);

  // Muzzle and nose
  sphere(bear, lightBrown, [0, 2.04, 0.58], [0.4, 0.27, 0.22]);
  sphere(bear, black, [0, 2.17, 0.79], [0.13, 0.09, 0.07]);

  // Eyes
// Eye highlights
sphere(bear, eyeShine, [-0.29, 2.44, 0.68], [0.035, 0.045, 0.025]);
sphere(bear, eyeShine, [0.29, 2.44, 0.68], [0.035, 0.045, 0.025]);

// Rosy cheeks
sphere(bear, pink, [-0.56, 2.12, 0.52], [0.13, 0.08, 0.035]);
sphere(bear, pink, [0.56, 2.12, 0.52], [0.13, 0.08, 0.035]);  sphere(bear, white, [-0.29, 2.39, 0.58], [0.13, 0.16, 0.07]);
  sphere(bear, white, [0.29, 2.39, 0.58], [0.13, 0.16, 0.07]);
  sphere(bear, black, [-0.27, 2.39, 0.645], [0.065, 0.09, 0.035]);
  sphere(bear, black, [0.31, 2.39, 0.645], [0.065, 0.09, 0.035]);

  // Arms
  const leftArm = new THREE.Group();
  leftArm.position.set(-0.75, 1.65, 0);
  bear.add(leftArm);
  sphere(leftArm, brown, [-0.22, -0.2, 0], [0.23, 0.55, 0.25]);

  const rightArm = new THREE.Group();
  rightArm.position.set(0.75, 1.65, 0);
  bear.add(rightArm);
  sphere(rightArm, brown, [0.22, -0.2, 0], [0.23, 0.55, 0.25]);

  // Legs
  sphere(bear, brown, [-0.4, 0.3, 0], [0.3, 0.45, 0.34]);
  sphere(bear, brown, [0.4, 0.3, 0], [0.3, 0.45, 0.34]);

  // Smile
  const smileCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-0.18, 1.98, 0.77),
    new THREE.Vector3(0, 1.88, 0.82),
    new THREE.Vector3(0.18, 1.98, 0.77)
  );
  const smile = new THREE.Mesh(
    new THREE.TubeGeometry(smileCurve, 20, 0.025, 8, false),
    black
  );
  bear.add(smile);

  // Dance animation
  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);

    const t = clock.getElapsedTime();

    bear.position.y = 0.12 + Math.abs(Math.sin(t * 3)) * 0.18;
    bear.rotation.y = Math.sin(t * 1.5) * 0.18;
    leftArm.rotation.z = Math.sin(t * 4) * 0.65;
    rightArm.rotation.z = -Math.sin(t * 4) * 0.65;

    renderer.render(scene, camera);
  }

  animate();

  // Keep the stage responsive
  window.addEventListener("resize", () => {
    const width = sceneContainer.clientWidth;
    const height = sceneContainer.clientHeight;
    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
  });
}
</script>
</body>
</html>
